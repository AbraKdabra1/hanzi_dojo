# ---------------------------------------------------------------------------
# Integración continua de Hanzi Dojo
#
# En cada push, GitHub (en sus servidores) hace lo mismo que harías tú:
#   1. Valida la base de datos (python herramientas_datos/validar_db.py)
#   2. flutter analyze  → errores y avisos del código Dart
#   3. flutter test     → pruebas automáticas
#   4. flutter build apk --profile → APK para probar la fluidez en el teléfono
#
# El APK queda en la pestaña "Actions" del repo (sección Artifacts) y se puede
# instalar directo en el teléfono.
#
# En ramas de trabajo (no en main) los resultados de texto se publican además
# en la rama "ci-registros", para poder leerlos sin entrar a la web.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches-ignore: [ci-registros]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # necesario solo para publicar en la rama ci-registros

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # SQLite nativo para las pruebas de base de datos (sqflite_common_ffi).
      - name: Instalar libsqlite3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5   # la misma versión que en tu PC
          cache: true


      # La base de contenido se vuelve a construir desde las fuentes. Si la
      # versión cambia respecto a la del repo, alguien olvidó correr
      # construir_db.py después de editar las fuentes.
      - name: Construir y validar base de datos
        id: validar
        continue-on-error: true
        run: |
          set -o pipefail
          python3 herramientas_datos/construir_db.py 2>&1 | tee validar_db.txt
          python3 herramientas_datos/validar_db.py --permitir-incompleto 2>&1 | tee -a validar_db.txt
          git diff --exit-code --stat -- lib/datos/version_contenido.dart 2>&1 | tee -a validar_db.txt

      - name: Dependencias
        run: flutter pub get 2>&1 | tee pub_get.txt

      - name: Analizar código
        id: analyze
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.txt
          exit ${PIPESTATUS[0]}

      - name: Pruebas
        id: test
        continue-on-error: true
        run: |
          flutter test --reporter expanded 2>&1 | tee test.txt
          exit ${PIPESTATUS[0]}

      - name: Compilar APK (profile)
        id: apk
        continue-on-error: true
        run: |
          flutter build apk --profile 2>&1 | tee build_apk.txt
          exit ${PIPESTATUS[0]}

      - name: Guardar APK
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hanzi-dojo-profile-apk
          path: build/app/outputs/flutter-apk/app-profile.apk
          retention-days: 14

      - name: Publicar registros en la rama ci-registros
        if: always() && github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/reg && cp -f *.txt pubspec.lock /tmp/reg/ 2>/dev/null || true
          cd /tmp/reg
          {
            echo "commit: $GITHUB_SHA"
            echo "rama: $GITHUB_REF_NAME"
            echo "validar_db: ${{ steps.validar.outcome }}"
            echo "analyze: ${{ steps.analyze.outcome }}"
            echo "test: ${{ steps.test.outcome }}"
            echo "apk: ${{ steps.apk.outcome }}"
          } > resumen.txt
          git init -q && git checkout -q -b ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Registros CI de $GITHUB_REF_NAME @ ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci:refs/heads/ci-registros

      - name: Resultado final
        if: always()
        run: |
          echo "validar_db=${{ steps.validar.outcome }} analyze=${{ steps.analyze.outcome }} test=${{ steps.test.outcome }} apk=${{ steps.apk.outcome }}"
          test "${{ steps.analyze.outcome }}" = "success" -a "${{ steps.test.outcome }}" = "success" -a "${{ steps.apk.outcome }}" = "success" -a "${{ steps.validar.outcome }}" = "success"
