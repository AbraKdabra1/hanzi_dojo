# ---------------------------------------------------------------------------
# iOS: compila la app para iPhone/iPad en una Mac de GitHub (gratis en
# repositorios públicos) y la prueba en el simulador.
#
#   · Hanzi_Dojo_sin_firmar.ipa (artifact "hanzi-dojo-ios-sin-firmar"): se
#     instala con AltStore o Sideloadly usando tu propio Apple ID, sin pagar
#     nada (ver docs/ios.md).
#   · Simulador: integration_test/ios_test.dart abre la app, revisa que las
#     grabaciones suenen en iOS y toma capturas (flutter test en el
#     simulador; las capturas las guarda la prueba y aquí se recogen).
#
# Registros y capturas → rama ci-ios (resumen.txt, *.txt, capturas/*.png).
# ---------------------------------------------------------------------------
name: iOS

on:
  push:
    branches-ignore: [ci-registros, ci-analisis, ci-ios, main]
  workflow_dispatch:

permissions:
  contents: write   # solo para publicar en la rama ci-ios

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5   # la misma que en Android
          cache: true

      - name: Dependencias
        run: flutter pub get 2>&1 | tee pub_get.txt

      - name: Compilar para iPhone (.ipa sin firmar)
        id: ipa
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build_ios.txt
          rm -rf Payload && mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Hanzi_Dojo_sin_firmar.ipa Payload
          ls -la Hanzi_Dojo_sin_firmar.ipa | tee -a build_ios.txt

      - name: Guardar .ipa
        if: steps.ipa.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hanzi-dojo-ios-sin-firmar
          path: Hanzi_Dojo_sin_firmar.ipa
          retention-days: 14

      - name: Probar en el simulador de iPhone
        id: simulador
        continue-on-error: true
        timeout-minutes: 32
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          print(next(x['udid'] for k, v in sorted(d.items(), reverse=True) if 'iOS' in k
                     for x in v if x['name'].startswith('iPhone')))")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "Simulador: $UDID" | tee simulador.txt
          # En español, como la mayoría de quienes la usan.
          xcrun simctl spawn "$UDID" defaults write "Apple Global Domain" AppleLanguages -array es-MX || true
          xcrun simctl spawn "$UDID" defaults write "Apple Global Domain" AppleLocale -string es_MX || true
          xcrun simctl bootstatus "$UDID" -b 2>&1 | tail -2 | tee -a simulador.txt
          xcrun simctl list runtimes | tee -a simulador.txt
          mkdir -p "$PWD/build/capturas_ios"
          # A veces la app no llega a conectarse con la prueba en el simulador
          # (se queda esperando sin decir nada): cada intento tiene 14 minutos
          # y se reintenta una vez.
          for intento in 1 2; do
            echo "── Intento $intento ──" | tee -a simulador.txt
            if perl -e 'alarm shift; exec @ARGV' 840 \
                flutter test integration_test/ios_test.dart -d "$UDID" --reporter expanded \
                --dart-define=CAPTURAS="$PWD/build/capturas_ios" 2>&1 | tee -a simulador.txt; then
              exit 0
            fi
            grep -q 'Hanzi Dojo en el simulador de iPhone' simulador.txt && grep -q '\[E\]' simulador.txt && exit 1
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b > /dev/null 2>&1 || true
          done
          exit 1

      - name: Capturas del simulador
        if: always()
        continue-on-error: true
        run: |
          mkdir -p build/capturas_ios
          # La prueba guarda sus capturas en la carpeta temporal de la app (en
          # el simulador es una carpeta de la Mac) y escribe la ruta.
          grep -o 'CAPTURA: .*\.png' simulador.txt | sed 's/^CAPTURA: //' | while read -r f; do
            cp "$f" build/capturas_ios/ 2>/dev/null || true
          done
          # Y cómo quedó la pantalla al final, pase lo que pase.
          [ -n "$UDID" ] && xcrun simctl io "$UDID" screenshot build/capturas_ios/99_al_terminar.png || true
          ls -la build/capturas_ios

      - name: Publicar registros en la rama ci-ios
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/reg && cp -f *.txt pubspec.lock /tmp/reg/ 2>/dev/null || true
          mkdir -p /tmp/reg/capturas && cp -f build/capturas_ios/*.png /tmp/reg/capturas/ 2>/dev/null || true
          cd /tmp/reg
          {
            echo "commit: $GITHUB_SHA"
            echo "rama: $GITHUB_REF_NAME"
            echo "ipa: ${{ steps.ipa.outcome }}"
            echo "simulador: ${{ steps.simulador.outcome }}"
          } > resumen.txt
          git init -q && git checkout -q -b ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Registros iOS de $GITHUB_REF_NAME @ ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci:refs/heads/ci-ios

      - name: Resultado final
        if: always()
        run: |
          echo "ipa=${{ steps.ipa.outcome }} simulador=${{ steps.simulador.outcome }}"
          test "${{ steps.ipa.outcome }}" = "success" -a "${{ steps.simulador.outcome }}" = "success"
