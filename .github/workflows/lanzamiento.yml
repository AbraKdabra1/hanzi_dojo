# ---------------------------------------------------------------------------
# Lanzamiento de Meizi Hanzi
#
# Se publica una versión de dos formas (una beta, v2.1.0-beta.1, sale marcada
# como "pre-release"):
#   · Con un commit: al llegar a la rama v2 un cambio de versión en
#     pubspec.yaml (o de este archivo), si esa versión aún no está publicada.
#     La etiqueta (v2.1.0) la crea el propio flujo.
#   · Con una etiqueta: git tag v2.1.0 && git push origin v2.1.0.
# En los dos casos:
#   1. Arma android/key.properties con la llave de firma guardada en los
#      secretos del repositorio (ver docs/publicar.md). Sin ellos, se detiene.
#   2. Compila los APK de lanzamiento firmados: uno por arquitectura (más
#      ligeros) y uno universal.
#   3. Crea la versión en GitHub (pestaña Releases) con los APK, sus sumas
#      SHA-256 y la huella del certificado, y las notas de CHANGELOG.md.
#   4. En una Mac de GitHub compila el .ipa de iPhone/iPad sin firmar y lo
#      agrega a la versión (se instala con el Apple ID de cada quien, ver
#      docs/ios.md).
#
# También se puede correr a mano (Actions → Lanzamiento → Run workflow): en
# ese caso solo deja los APK como artefactos, sin publicar nada. Un commit a v2
# cuya versión ya está publicada no hace nada.
# ---------------------------------------------------------------------------
name: Lanzamiento

on:
  push:
    tags: ['v*']
    branches: [v2]
    # Solo para la rama (a las etiquetas no se les revisan las rutas).
    paths: [pubspec.yaml, .github/workflows/lanzamiento.yml]
  workflow_dispatch:

permissions:
  contents: write   # crear la versión y subir los APK

jobs:
  # ¿Qué versión es y hay que publicarla?
  cual:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.cual.outputs.version }}
      etiqueta: ${{ steps.cual.outputs.etiqueta }}
      compilar: ${{ steps.cual.outputs.compilar }}
      publicar: ${{ steps.cual.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4

      - name: Versión y si ya está publicada
        id: cual
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9A-Za-z.-]+)\+([0-9]+).*/\1/')
          ETIQUETA="v$VERSION"
          COMPILAR=true
          PUBLICAR=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$ETIQUETA" ]; then
              echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión de pubspec.yaml ($VERSION)"
              exit 1
            fi
            if gh release view "$ETIQUETA" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "La versión $ETIQUETA ya está publicada: no hay nada que hacer."
              COMPILAR=false
            else
              PUBLICAR=true
            fi
          fi
          {
            echo "version=$VERSION"
            echo "etiqueta=$ETIQUETA"
            echo "compilar=$COMPILAR"
            echo "publicar=$PUBLICAR"
          } >> "$GITHUB_OUTPUT"
          echo "versión=$VERSION etiqueta=$ETIQUETA compilar=$COMPILAR publicar=$PUBLICAR"

  apk:
    needs: cual
    if: needs.cual.outputs.compilar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - name: Llave de firma
        env:
          LLAVE_BASE64: ${{ secrets.LLAVE_BASE64 }}
          LLAVE_CLAVE: ${{ secrets.LLAVE_CLAVE }}
          LLAVE_ALIAS: ${{ secrets.LLAVE_ALIAS }}
        run: |
          if [ -z "$LLAVE_BASE64" ] || [ -z "$LLAVE_CLAVE" ] || [ -z "$LLAVE_ALIAS" ]; then
            echo "::error::Faltan los secretos LLAVE_BASE64, LLAVE_CLAVE y LLAVE_ALIAS (ver docs/publicar.md)"
            exit 1
          fi
          echo "$LLAVE_BASE64" | base64 -d > "$RUNNER_TEMP/hanzi_dojo_lanzamiento.jks"
          {
            echo "storeFile=$RUNNER_TEMP/hanzi_dojo_lanzamiento.jks"
            echo "storePassword=$LLAVE_CLAVE"
            echo "keyAlias=$LLAVE_ALIAS"
            echo "keyPassword=$LLAVE_CLAVE"
          } > android/key.properties

      - name: Versión
        id: version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9A-Za-z.-]+)\+([0-9]+).*/\1/')
          CODIGO=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9A-Za-z.-]+)\+([0-9]+).*/\2/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "::error::La etiqueta ${GITHUB_REF_NAME} no coincide con la versión de pubspec.yaml ($VERSION)"
            exit 1
          fi

      - name: Dependencias
        run: flutter pub get

      - name: APK por arquitectura
        run: flutter build apk --release --split-per-abi

      - name: APK universal
        run: flutter build apk --release

      - name: Preparar archivos
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p salida
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk   "$GITHUB_WORKSPACE/salida/Meizi_Hanzi_${VERSION}_arm64.apk"
          cp app-armeabi-v7a-release.apk "$GITHUB_WORKSPACE/salida/Meizi_Hanzi_${VERSION}_arm32.apk"
          cp app-x86_64-release.apk      "$GITHUB_WORKSPACE/salida/Meizi_Hanzi_${VERSION}_x86_64.apk"
          cp app-release.apk             "$GITHUB_WORKSPACE/salida/Meizi_Hanzi_${VERSION}_universal.apk"
          cd "$GITHUB_WORKSPACE/salida"
          sha256sum *.apk > SHA256SUMS.txt
          # Huella del certificado: quien instale puede comprobar que el APK es el oficial.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "Meizi_Hanzi_${VERSION}_universal.apk" \
            | grep -E 'SHA-256' | head -1 | sed -E 's/.*SHA-256 digest: //' > huella.txt
          cat SHA256SUMS.txt huella.txt
          # Permisos del APK final: avisa si aparece alguno que no esperamos
          # (internet es solo para el aviso de versión nueva, docs/privacidad.md).
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions "Meizi_Hanzi_${VERSION}_universal.apk" | tee permisos.txt
          ESPERADOS='INTERNET|ACCESS_NETWORK_STATE|POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED|DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'
          OTROS=$(grep -oE "name='[^']+'" permisos.txt | sed -E "s/name='(.*)'/\1/" | grep -vE "$ESPERADOS" || true)
          if [ -n "$OTROS" ]; then
            echo "::warning::El APK pide permisos que no esperábamos: $OTROS"
          fi
          rm permisos.txt

      - name: Notas de la versión
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # La sección "## VERSION" de CHANGELOG.md, hasta la siguiente "## ".
          # Una beta (2.1.0-beta.1) usa la sección de su versión (## 2.1.0).
          BASE="${VERSION%%-*}"
          {
            if [ "$BASE" != "$VERSION" ]; then
              echo "> **Versión de prueba (beta).** Gracias por probarla: cuéntanos qué falla o qué mejorarías (ver docs/beta.md)."
              echo ""
            fi
            awk -v v="## $BASE" '
              index($0, v) == 1 { dentro = 1; next }
              dentro && /^## / { exit }
              dentro { print }
            ' CHANGELOG.md
          } > notas.md
          {
            echo ""
            echo "### Qué APK descargar"
            echo "- **arm64**: casi todos los teléfonos de los últimos años (el más ligero)."
            echo "- **universal**: si no sabes cuál, este funciona en todos."
            echo "- **iOS_sin_firmar.ipa**: iPhone y iPad, se instala con tu propio Apple ID (gratis; ver docs/ios.md)."
            echo ""
            echo "Huella SHA-256 del certificado de firma: \`$(cat salida/huella.txt)\`"
          } >> notas.md
          cat notas.md

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: meizi-hanzi-${{ steps.version.outputs.version }}
          path: salida/
          retention-days: 30

      # Solo el de arm64 (casi todos los teléfonos), aparte: para probar una
      # versión desde el teléfono antes de publicarla (~60 MB en vez de ~300).
      - name: Guardar APK arm64 aparte
        uses: actions/upload-artifact@v4
        with:
          name: meizi-hanzi-${{ steps.version.outputs.version }}-arm64
          path: salida/*_arm64.apk
          retention-days: 30

      # Huawei AppGallery (docs/publicar.md): la misma app y la misma llave,
      # universal, pero sin el aviso de versión nueva de GitHub: la tienda pide
      # que las actualizaciones lleguen solo por ella (regla 3.9). Va aparte,
      # no en la página de la versión, para no confundir a quien descarga.
      - name: APK para AppGallery
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flutter build apk --release --dart-define=TIENDA=appgallery
          mkdir -p appgallery
          cp build/app/outputs/flutter-apk/app-release.apk "appgallery/Meizi_Hanzi_${VERSION}_appgallery.apk"
          ls -la appgallery

      - name: Guardar APK de AppGallery
        uses: actions/upload-artifact@v4
        with:
          name: meizi-hanzi-${{ steps.version.outputs.version }}-appgallery
          path: appgallery/
          retention-days: 90

      - name: Publicar la versión en GitHub
        if: needs.cual.outputs.publicar == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          ETIQUETA: ${{ needs.cual.outputs.etiqueta }}
        run: |
          # Una versión con guion (2.1.0-beta.1) sale marcada como de prueba.
          PRUEBA=""
          case "$VERSION" in *-*) PRUEBA="--prerelease" ;; esac
          # Si se publica con un commit, la etiqueta se crea aquí, en ese commit.
          gh release create "$ETIQUETA" salida/*.apk salida/SHA256SUMS.txt --target "$GITHUB_SHA" \
            --title "Meizi Hanzi $VERSION" --notes-file notas.md $PRUEBA

      - name: Borrar la llave del equipo de GitHub
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/hanzi_dojo_lanzamiento.jks"

  ipa:
    needs: [cual, apk]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - name: Compilar para iPhone (.ipa sin firmar)
        id: version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9A-Za-z.-]+)\+([0-9]+).*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          flutter pub get
          flutter build ios --release --no-codesign
          mkdir Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "Meizi_Hanzi_${VERSION}_iOS_sin_firmar.ipa" Payload
          shasum -a 256 "Meizi_Hanzi_${VERSION}_iOS_sin_firmar.ipa"

      - name: Guardar .ipa como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: meizi-hanzi-${{ steps.version.outputs.version }}-ios
          path: "*.ipa"
          retention-days: 30

      - name: Agregar a la versión en GitHub
        if: needs.cual.outputs.publicar == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ETIQUETA: ${{ needs.cual.outputs.etiqueta }}
        run: gh release upload "$ETIQUETA" *.ipa --clobber
