# ─────────────────────────────────────────────────────────────────────────────
# Meizi Hanzi — configuración del paquete Flutter
# ─────────────────────────────────────────────────────────────────────────────
name: hanzi_dojo
description: "Meizi Hanzi: app para aprender a escribir caracteres chinos (HSK 3.0) con repaso espaciado."

# No se publica en pub.dev (es una app, no una biblioteca).
publish_to: 'none'

# versión visible + número de compilación (Android versionCode).
# Súbelos cada vez que publiques en Play Store: 1.1.0+2, 1.2.0+3, ...
version: 2.1.0-beta.2+4

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  # Textos propios de Flutter (reloj, botones de diálogos…) en español o inglés.
  flutter_localizations:
    sdk: flutter

  # Base de datos SQLite (contenido de solo lectura + progreso del usuario).
  sqflite: ^2.4.2
  # Unir rutas de archivos de forma portátil.
  path: ^1.9.1
  # Convierte los contornos SVG de make-me-a-hanzi en objetos Path de Flutter.
  path_drawing: ^1.0.1
  # Trazo de pincel con grosor variable a partir de los puntos del dedo.
  perfect_freehand: ^2.5.2+1
  # Pronunciación en voz alta (usa el motor de voz del teléfono).
  flutter_tts: ^4.2.5
  # Grabaciones de pronunciación que trae la app (assets/audio/, en Opus).
  just_audio: ^0.10.4
  # iOS: sesión de audio en modo voz (suena aunque esté en silencio).
  audio_session: ^0.2.1
  # Versión web: SQLite en WebAssembly (bases en IndexedDB) y el navegador
  # (descargar, elegir archivo, compartir).
  sqflite_common_ffi_web: ^1.0.1
  web: ^1.1.0
  # gzip del respaldo y deflate de los EPUB, en Dart puro (también en la web).
  archive: ^4.0.7
  # Íconos estilo iOS (se usan en algunos botones).
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  # La app de verdad en el simulador de iPhone (integration_test/, flujo ios.yml).
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  # SQLite para las pruebas automáticas en computadora (sin teléfono).
  sqflite_common_ffi: ^2.3.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Base de contenido prearmada (herramientas_datos/construir_db.py).
    - assets/db/contenido.db
    # Textos de licencia de las fuentes de datos y de la tipografía.
    - assets/licencias/
    # Grabaciones de pronunciación (herramientas_datos/preparar_audio.py, CC BY-SA).
    - assets/audio/
    - assets/audio/silabas/
    - assets/audio/palabras/
    # Roce de pincel al acertar un trazo (sintetizado para la app; Ajustes › Sonido de pincel).
    - assets/sonidos/

  fonts:
    # Noto Sans SC recortada a los caracteres de la app
    # (herramientas_datos/recortar_fuente.py). Licencia OFL.
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
    # Emoji y símbolos de la interfaz, solo para la versión web (en el teléfono
    # los pone el sistema): herramientas_datos/preparar_simbolos_web.py. OFL.
    - family: SimbolosHanzi0
      fonts:
        - asset: assets/fonts/simbolos/SimbolosHanzi0.ttf
    - family: SimbolosHanzi1
      fonts:
        - asset: assets/fonts/simbolos/SimbolosHanzi1.ttf
    - family: SimbolosHanzi2
      fonts:
        - asset: assets/fonts/simbolos/SimbolosHanzi2.ttf
    - family: SimbolosHanzi3
      fonts:
        - asset: assets/fonts/simbolos/SimbolosHanzi3.ttf
    - family: SimbolosHanzi4
      fonts:
        - asset: assets/fonts/simbolos/SimbolosHanzi4.ttf
    - family: SimbolosHanzi5
      fonts:
        - asset: assets/fonts/simbolos/SimbolosHanzi5.ttf
    - family: SimbolosHanzi6
      fonts:
        - asset: assets/fonts/simbolos/SimbolosHanzi6.ttf
